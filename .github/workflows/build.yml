name: android-build
# Builds the APK from this repository's source (upstream
# starling-client/starling), signs it with the project-owned keystore stored in
# this repository's secrets, and (when asked to publish) releases it.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release after the build"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: APK (source build, own key)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Rust target and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk

      - name: Android SDK pieces
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/platforms/android-36" ] || yes | "$manager" "platforms;android-36" >/dev/null
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || yes | "$manager" "build-tools;35.0.0" >/dev/null
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            latest="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
            if [ -n "$latest" ]; then
              echo "ANDROID_NDK_HOME=$latest" >> "$GITHUB_ENV"
            else
              yes | "$manager" "ndk;28.2.13676358" >/dev/null
            fi
          fi

      - name: Project keystore (STARLING_KEYSTORE_BASE64)
        env:
          STARLING_KEYSTORE_BASE64: ${{ secrets.STARLING_KEYSTORE_BASE64 }}
          STARLING_KEY_ALIAS: ${{ secrets.STARLING_KEY_ALIAS }}
          STARLING_STORE_PASSWORD: ${{ secrets.STARLING_STORE_PASSWORD }}
          STARLING_KEY_PASSWORD: ${{ secrets.STARLING_KEY_PASSWORD }}
        run: |
          printf '%s' "$STARLING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/starling.keystore"
          {
            echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/starling.keystore"
            echo "HORIZON_ANDROID_KEY_ALIAS=$(printf '%s' "$STARLING_KEY_ALIAS" | tr -d '\n\r')"
            echo "HORIZON_ANDROID_STORE_PASSWORD=$(printf '%s' "$STARLING_STORE_PASSWORD" | tr -d '\n\r')"
            echo "HORIZON_ANDROID_KEY_PASSWORD=$(printf '%s' "$STARLING_KEY_PASSWORD" | tr -d '\n\r')"
          } >> "$GITHUB_ENV"

      # Fail here, in seconds, rather than after a fifteen minute native build:
      # a keystore and its alias/password that do not match cannot sign anything.
      - name: Check the keystore opens and holds the alias
        run: |
          keytool -list \
            -keystore "$HORIZON_ANDROID_KEYSTORE" \
            -alias "$HORIZON_ANDROID_KEY_ALIAS" \
            -storepass:env HORIZON_ANDROID_STORE_PASSWORD
          printf '%s' "$HORIZON_ANDROID_KEYSTORE" | xargs ls -l

      - name: Build the offline APK from source (timed)
        id: build
        run: |
          start="$(date -u +%s)"
          python3 packaging/android/build_apk.py --profile release --offline
          end="$(date -u +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          ls -lh target/android/*.apk

      # The payload is inside the APK: no game-data host is left in the library, one ABI, and
      # assets/bundled/manifest.json is there (tools/check_no_downloader.py).
      - name: Check the downloader is out of the APK
        run: python3 tools/check_no_downloader.py --apk "$(ls target/android/minecraft-*.apk)"

      - name: Verify the signature and record the certificate
        run: |
          apk="$(ls target/android/minecraft-*.apk)"
          version="$(basename "$apk" .apk)"
          version="${version##*-}"
          cp "$apk" "minecraft-arm64-${version}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          sha256sum "$apk" "minecraft-arm64-${version}.apk" > apk.sha256
          sha256sum certs.txt apk.sha256 > SHA256SUMS

      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix=minecraft-source/ -o minecraft-source.tar.gz HEAD
          sha256sum minecraft-source.tar.gz >> SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-apk
          # The payload is already compressed (PNGs, OGGs, the JRE): zipping it again only
          # costs the upload time.
          compression-level: 0
          path: |
            target/android/minecraft-*.apk
            minecraft-arm64-*.apk
            certs.txt
            apk.sha256
            minecraft-source.tar.gz
            SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="minecraft-$(date -u +%Y%m%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, not publishing again"
            exit 0
          fi
          notes="build.md"
          {
            echo "## Minecraft APK built from source"
            echo
            echo "- Source: upstream \`starling-client/starling\` at \`$(git rev-parse --short=10 HEAD)\`, built with its own pipeline \`packaging/android/build_apk.py\` (Rust, Android NDK, JDK 25; no Gradle, no prebuilt APK)."
            echo "- Application id \`rust.minecraft\`, app name \`Minecraft\`; one app, no variant suffix."
            echo "- Signed with this repository's project-owned key; the official upstream release key is not used, requested or stored here."
            echo "- **Offline build**: every game file (the pinned version file, the client and server jars, the libraries, the asset index and its objects), the Java runtime that prepares them and Bedrock's control textures are inside the APK under \`assets/bundled/\`. A fresh install downloads nothing: the setup unpacks them on the device."
            echo "- arm64-v8a only: the APK holds one native ABI directory, \`lib/arm64-v8a/\`."
            echo "- The bundled payload was staged at build time from Mojang's published files (checked against \`research-lock.json\`'s SHA-1 pins) and is not part of the public source tree."
            echo "- Build time (compile + package + sign): ${{ steps.build.outputs.seconds }} s."
            echo
            echo '### Certificate (apksigner verify --print-certs)'
            echo '```'
            cat certs.txt
            echo '```'
            echo
            echo '### Test matrix'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Build from upstream source with the project pipeline | PASS |'
            echo '| `apksigner verify --print-certs` | PASS |'
            echo '| APK payload (`lib/arm64-v8a`, dex, assets) | PASS |'
            echo '| Install on a real device or emulator | **NOT TESTED** (no device attached) |'
            echo '| Touch, controllers, frame rates, Android version behaviour | **NOT TESTED** |'
            echo '| Offline payload in the APK (`assets/bundled/manifest.json`, `game-files.zip`, the JRE, `assets.zip`) | PASS |'
            echo '| Downloader absent from `libhorizon_android.so` (`tools/check_no_downloader.py`) | PASS |'
            echo '| Single ABI (`lib/arm64-v8a/` only) | PASS |'
            echo
            echo '### Files'
            echo
            for apk in minecraft-arm64-*.apk target/android/minecraft-*.apk; do
              echo "- \`$(basename "$apk")\` - the signed offline APK."
            done
            echo '- `minecraft-source.tar.gz` - the exact source it was built from.'
            echo '- `certs.txt`, `apk.sha256`, `SHA256SUMS`.'
            echo
            echo '### Checksums'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > "$notes"
          gh release create "$tag" --title "Minecraft offline APK $tag" --notes-file "$notes" \
            minecraft-arm64-*.apk "$(ls target/android/minecraft-*.apk)" certs.txt apk.sha256 \
            minecraft-source.tar.gz SHA256SUMS

      - name: Job summary
        if: always()
        run: |
          {
            echo "### build"
            echo
            echo "- Build time: ${{ steps.build.outputs.seconds }} s"
            echo "- APK: $(ls -l target/android/minecraft-*.apk 2>/dev/null | awk '{print $5" bytes"}' || echo 'not produced')"
          } >> "$GITHUB_STEP_SUMMARY"
