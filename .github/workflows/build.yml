name: android-build
# One dispatch, two parallel jobs:
#   starling -- builds the APK from this repository's source (upstream
#               starling-client/starling), signs it with the project-owned
#               keystore stored in this repository's secrets.
#   twofold  -- checks out mdmuntakim/twofold, builds and tests it, and (when
#               asked to publish) releases the signed APK.
# Both jobs start at the same time, neither waits for the other.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish releases after the builds"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  starling:
    name: starling (source build, own key)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Rust target and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk

      - name: Android SDK pieces
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/platforms/android-36" ] || yes | "$manager" "platforms;android-36" >/dev/null
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || yes | "$manager" "build-tools;35.0.0" >/dev/null
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            latest="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
            if [ -n "$latest" ]; then
              echo "ANDROID_NDK_HOME=$latest" >> "$GITHUB_ENV"
            else
              yes | "$manager" "ndk;28.2.13676358" >/dev/null
            fi
          fi

      - name: Project keystore (STARLING_KEYSTORE_BASE64)
        env:
          STARLING_KEYSTORE_BASE64: ${{ secrets.STARLING_KEYSTORE_BASE64 }}
          STARLING_KEY_ALIAS: ${{ secrets.STARLING_KEY_ALIAS }}
          STARLING_STORE_PASSWORD: ${{ secrets.STARLING_STORE_PASSWORD }}
          STARLING_KEY_PASSWORD: ${{ secrets.STARLING_KEY_PASSWORD }}
        run: |
          printf '%s' "$STARLING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/starling.keystore"
          {
            echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/starling.keystore"
            echo "HORIZON_ANDROID_KEY_ALIAS=$(printf '%s' "$STARLING_KEY_ALIAS" | tr -d '\n\r')"
            echo "HORIZON_ANDROID_STORE_PASSWORD=$(printf '%s' "$STARLING_STORE_PASSWORD" | tr -d '\n\r')"
            echo "HORIZON_ANDROID_KEY_PASSWORD=$(printf '%s' "$STARLING_KEY_PASSWORD" | tr -d '\n\r')"
          } >> "$GITHUB_ENV"

      # Fail here, in seconds, rather than after a fifteen minute native build:
      # a keystore and its alias/password that do not match cannot sign anything.
      - name: Check the keystore opens and holds the alias
        run: |
          keytool -list \
            -keystore "$HORIZON_ANDROID_KEYSTORE" \
            -alias "$HORIZON_ANDROID_KEY_ALIAS" \
            -storepass:env HORIZON_ANDROID_STORE_PASSWORD
          printf '%s' "$HORIZON_ANDROID_KEYSTORE" | xargs ls -l

      - name: Build the APK from source (timed)
        id: build
        run: |
          start="$(date -u +%s)"
          python3 packaging/android/build_apk.py --preview --profile release
          end="$(date -u +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          ls -lh target/android/*.apk

      - name: Verify the signature and record the certificate
        run: |
          apk="$(ls target/android/starling-preview-*.apk)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          sha256sum "$apk" > apk.sha256
          sha256sum certs.txt apk.sha256 > SHA256SUMS

      - name: Source archive
        run: |
          git archive --format=tar.gz --prefix=starling-source/ -o starling-source.tar.gz HEAD
          sha256sum starling-source.tar.gz >> SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: starling-apk
          path: |
            target/android/starling-preview-*.apk
            certs.txt
            apk.sha256
            starling-source.tar.gz
            SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="starling-$(date -u +%Y%m%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, not publishing again"
            exit 0
          fi
          notes="build.md"
          {
            echo "## Starling APK built from source"
            echo
            echo "- Source: upstream \`starling-client/starling\` at \`$(git rev-parse --short=10 HEAD)\`, built with its own pipeline \`packaging/android/build_apk.py\` (Rust, Android NDK, JDK 25; no Gradle, no prebuilt APK)."
            echo "- Variant: preview, application id \`rust.minecraft.preview\`, installs beside the official app. It can never replace or update the official Starling release."
            echo "- Signed with this repository's project-owned key (\`starling-build\`); the official upstream release key is not used, requested or stored here."
            echo "- Build time (compile + package + sign): ${{ steps.build.outputs.seconds }} s."
            echo
            echo '### Certificate (apksigner verify --print-certs)'
            echo '```'
            cat certs.txt
            echo '```'
            echo
            echo '### Test matrix'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo '| Build from upstream source with the project pipeline | PASS |'
            echo '| `apksigner verify --print-certs` | PASS |'
            echo '| APK payload (`lib/arm64-v8a`, dex, assets) | PASS |'
            echo '| Install on a real device or emulator | **NOT TESTED** (no device attached) |'
            echo '| Touch, controllers, frame rates, Android version behaviour | **NOT TESTED** |'
            echo '| Full offline bundle | **NOT SHIPPED** - standard source build; assets/prepare-kit.zip is used on the phone |'
            echo
            echo '### Files'
            echo
            echo '- `starling-preview-0.8.0-arm64-v8a.apk` - the signed APK.'
            echo '- `starling-source.tar.gz` - the exact source it was built from.'
            echo '- `certs.txt`, `apk.sha256`, `SHA256SUMS`.'
          } > "$notes"
          gh release create "$tag" --title "Starling source build $tag" --notes-file "$notes" \
            "$(ls target/android/starling-preview-*.apk)" certs.txt apk.sha256 starling-source.tar.gz SHA256SUMS

      - name: Job summary
        if: always()
        run: |
          {
            echo "### starling"
            echo
            echo "- Build time: ${{ steps.build.outputs.seconds }} s"
            echo "- APK: $(ls -l target/android/starling-preview-*.apk 2>/dev/null | awk '{print $5" bytes"}' || echo 'not produced')"
          } >> "$GITHUB_STEP_SUMMARY"

  twofold:
    name: twofold (build, test, release)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mdmuntakim/twofold
          ref: main
          token: ${{ secrets.OWNER_TOKEN }}

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build, unit tests and acceptance matrix (timed)
        id: build
        run: |
          start="$(date -u +%s)"
          bash scripts/acceptance.sh
          end="$(date -u +%s)"
          echo "seconds=$((end - start))" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: twofold-apk
          path: |
            dist/twofold-*.apk
            dist/twofold-*.apk.sha256
            dist/acceptance.txt
            dist/screenshots/*.png
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          tag="v$version"
          git archive --format=tar.gz --prefix="twofold-$tag/" -o "twofold-$tag-source.tar.gz" HEAD
          sha256sum "twofold-$tag-source.tar.gz" >> dist/twofold-*.apk.sha256 || true
          if gh release view "$tag" --repo mdmuntakim/twofold >/dev/null 2>&1; then
            echo "release $tag already exists, not publishing again"
            exit 0
          fi
          gh release create "$tag" --repo mdmuntakim/twofold \
            --title "Twofold $version" --notes-file docs/RELEASE_NOTES.md \
            "dist/twofold-$version-arm64-v8a.apk" "dist/twofold-$version-arm64-v8a.apk.sha256" \
            dist/acceptance.txt dist/screenshots/*.png "twofold-$tag-source.tar.gz"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### twofold"
            echo
            echo "- Build + tests: ${{ steps.build.outputs.seconds }} s"
            echo "- APK: $(ls -l dist/twofold-*.apk 2>/dev/null | awk '{print $5" bytes"}' || echo 'not produced')"
          } >> "$GITHUB_STEP_SUMMARY"
