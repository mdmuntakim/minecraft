[package]
name = "fabric-loader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A Fabric-compatible loader for Rust .fabricmod files"

[dependencies]
fabric-mod-format = { path = "../fabric-mod-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
