[package]
name = "fabric-mod-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The .fabricmod container, manifest schema and version constraints"

[dependencies]
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
