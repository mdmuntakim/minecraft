<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>Starling</title>
  <clipPath id="tile"><rect width="16" height="16" rx="3.5"/></clipPath>
  <g clip-path="url(#tile)">
    <rect width="16" height="16" fill="#101318"/>
    <!-- A grass block seen from above and left, drawn on the 16-unit grid: the top face, the two
         dirt sides, the grass that overhangs each side, and a fleck of rust in the top face. -->
    <polygon points="8,2.4 13.8,5.6 8,8.8 2.2,5.6" fill="#7ed05a"/>
    <polygon points="9.6,5.4 10.8,6 9.6,6.6 8.4,6" fill="#95e06f"/>
    <polygon points="6.4,4.2 7.2,4.6 6.4,5 5.6,4.6" fill="#c2622c"/>
    <polygon points="2.2,5.6 8,8.8 8,13.4 2.2,10.2" fill="#8a6a4a"/>
    <polygon points="13.8,5.6 8,8.8 8,13.4 13.8,10.2" fill="#6f5339"/>
    <polygon points="2.2,5.6 8,8.8 8,9.9 2.2,6.7" fill="#5aa83c"/>
    <polygon points="13.8,5.6 8,8.8 8,9.9 13.8,6.7" fill="#478a30"/>
  </g>
</svg>
